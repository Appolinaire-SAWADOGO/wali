services:
  postgres:
    image: postgres:latest
    container_name: wali-transaction-service-db
    restart: always
    environment:
      POSTGRES_USER: wali-transaction-service-db-user
      POSTGRES_PASSWORD: cezzq6Uzy5EbWy#z
      POSTGRES_DB: wali-transaction-service-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data+
volumes:
  postgres_data:
    driver: local