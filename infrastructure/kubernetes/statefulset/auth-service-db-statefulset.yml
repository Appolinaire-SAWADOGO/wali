  apiVersion: apps/v1
  kind: StatefulSet
  metadata:
    name: wali-auth-service-db
  spec:
    serviceName: wali-auth-service-db
    replicas: 1
    podManagementPolicy: OrderedReady
    selector:
      matchLabels:
        app: wali-auth-service-db
    template:
      metadata:
        labels:
          app: wali-auth-service-db
      spec:
        containers:
          - name: wali-auth-service-db
            image: postgres:latest
            ports:
              - containerPort: 5432
            env:
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: wali-auth-service-db-password
                    key: DB_PASSWORD
              - name: POSTGRES_USER
                value: wali-auth-service-db-user
              - name: POSTGRES_DB
                value: wali-auth-service-db
            resources:
              requests:
                cpu: "200m"
                memory: "384Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"
    volumeClaimTemplates:
      - metadata:
          name: postgres-storage
        spec:
          accessModes: [ "ReadWriteOnce" ]
          storageClassName: ebs-gp3-auto
          resources:
            requests:
              storage: 5Gi