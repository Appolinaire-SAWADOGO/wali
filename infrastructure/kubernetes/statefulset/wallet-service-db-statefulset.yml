
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wali-wallet-service-db
spec:
  serviceName: wali-wallet-service-db
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: wali-wallet-service-db
  template:
    metadata:
      labels:
        app: wali-wallet-service-db
    spec:
      containers:
        - name: wali-wallet-service-db
          image: postgres:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wali-wallet-service-db-password
                  key: DB_PASSWORD
            - name: POSTGRES_USER
              value: wali-wallet-service-db-user
            - name: POSTGRES_DB
              value: wali-wallet-service-db
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 5Gi