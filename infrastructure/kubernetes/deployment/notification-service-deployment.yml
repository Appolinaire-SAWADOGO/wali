apiVersion: apps/v1
kind: Deployment
metadata:
  name: wali-notification-service
  labels:
    app: wali-notification-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wali-notification-service
  template:
    metadata:
      labels:
        app: wali-notification-service
    spec:
      containers:
        - name: wali-notification-service
          image: 08072005/wali-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: "jdbc:postgresql://wali-notification-service-db.default.svc.cluster.local:5432/wali-notification-service-db"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wali-notification-service-db-password
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wali-jwt-secret
                  key: JWT_SECRET
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: wali-kafka.default.svc.cluster.local:9092
            - name: DB_USER
              value: wali-notification-service-db-user