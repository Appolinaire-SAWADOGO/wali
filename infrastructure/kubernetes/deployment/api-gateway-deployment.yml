apiVersion: apps/v1
kind: Deployment
metadata:
  name: wali-api-gateway
  labels:
    app: wali-api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wali-api-gateway
  template:
    metadata:
      labels:
        app: wali-api-gateway
    spec:
      containers:
        - name: wali-api-gateway
          image: 08072005/wali-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: AUTH_SERVICE_URL
              value: "http://wali-auth-service.default.svc.cluster.local:8080"
            - name: WALLET_SERVICE_URL
              value: "http://wali-wallet-service.default.svc.cluster.local:8080"
            - name: TRANSACTION_SERVICE_URL
              value: "http://wali-transaction-service.default.svc.cluster.local:8080"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://wali-notification-service.default.svc.cluster.local:8080"
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"