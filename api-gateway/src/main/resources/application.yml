server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: wallet-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/wallet/**
          filters:
            - StripPrefix=1

        - id: transaction-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/transaction/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/notification/**
          filters:
            - StripPrefix=1